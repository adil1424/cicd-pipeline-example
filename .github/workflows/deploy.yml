name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build Docker image
      run: docker build -t cicd-demo:latest .

    - name: Run tests
      run: echo "Running tests... (add pytest later)"

    - name: Login to container registry
      run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

    - name: Tag and push image
      run: |
        docker tag cicd-demo:latest ${{ secrets.REGISTRY_USERNAME }}/cicd-demo:latest
        docker push ${{ secrets.REGISTRY_USERNAME }}/cicd-demo:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3

    - name: Deploy to Kubernetes/OpenShift
      env:
        KUBECONFIG: ${{ secrets.KUBECONFIG }}
      run: |
        kubectl apply -f deployment.yaml
        kubectl apply -f service.yaml
